<html lang="fa" dir="rtl"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Text Summarizer & QA</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 40px;
    }

    .container {
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
    }

    textarea {
        width: 100%;
        min-height: 200px;
        padding: 15px;
        margin-top: 10px;

        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 10px;
        font-size: 16px;
        resize: vertical;
    }

    input {
        width: 100%;
        padding: 15px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 10px;
        font-size: 16px;
        margin-bottom: 15px;
    }

    button {
        padding: 12px 25px;
        border: none;
        border-radius: 8px;

        margin-left: 10px;

        margin-top: 30px;

```

</head>

<body>

<div class="container">

```
<h1>🧠 Text Summarizer & QA</h1>

<p>متن خود را وارد کنید:</p>

<textarea id="textInput"
          placeholder="متن خود را اینجا وارد کنید..."></textarea>


<h3>سؤال</h3>

<input
    type="text"
    id="questionInput"
    placeholder="اگر سوالی دارید اینجا بنویسید..."
>


<button onclick="summarizeText()">
    خلاصه کن
</button>

<button onclick="askQuestion()">
    پاسخ به سؤال
</button>

<button onclick="analyzeSentiment()">
    تحلیل احساس
</button>


<div id="result" class="result">
    نتیجه اینجا نمایش داده می‌شود...
</div>
```

</div>

<script>

async function summarizeText() {

    const text = document.getElementById("textInput").value;
    const result = document.getElementById("result");

    if (text.length < 20) {
        result.innerText = "لطفاً حداقل ۲۰ کاراکتر وارد کنید.";
        return;
    }

    result.innerText = "⏳ در حال خلاصه‌سازی...";

    try {

        const response = await fetch("/summarize", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                text: text
            })
        });

        const data = await response.json();

        if (!response.ok) {
            result.innerText = "خطا: " + data.detail;
            return;
        }

        result.innerText = data.summary;

    } catch (error) {

        result.innerText =
            "خطا در ارتباط با سرور: " + error.message;

    }
}

async function askQuestion() {

    const text = document.getElementById("textInput").value;
    const question = document.getElementById("questionInput").value;

    const result = document.getElementById("result");

    if (text.length < 20) {
        result.innerText = "لطفاً حداقل ۲۰ کاراکتر برای متن وارد کنید.";
        return;
    }

    if (question.length < 5) {
        result.innerText = "لطفاً یک سوال مناسب وارد کنید.";
        return;
    }

    result.innerText = "⏳ در حال پیدا کردن پاسخ...";

    try {

        const response = await fetch("/ask", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                context_text: text,

                question: question

            })
        });

        const data = await response.json();

        if (!response.ok) {
            result.innerText = "خطا: " + data.detail;
            return;
        }

        result.innerText = data.answer;

    } catch (error) {

        result.innerText =
            "خطا در ارتباط با سرور: " + error.message;

    }
}

async function analyzeSentiment() {

    const text = document.getElementById("textInput").value;
    const result = document.getElementById("result");

    if (text.length < 5) {
        result.innerText = "لطفاً حداقل ۵ کاراکتر وارد کنید.";
        return;
    }

    result.innerText = "⏳ در حال تحلیل احساس...";

    try {
        const response = await fetch("/sentiment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: text })
        });

        const data = await response.json();

        if (!response.ok) {
            result.innerText = "خطا: " + data.detail;
            return;
        }

        result.innerText =
            "احساس: " + data.sentiment +
            "\nاطمینان: " + (data.score * 100).toFixed(1) + "٪";

    } catch (error) {
        result.innerText = "خطا در ارتباط با سرور: " + error.message;
    }
}

</script>

</body>
</html>
